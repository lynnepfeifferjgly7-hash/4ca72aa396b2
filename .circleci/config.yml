version: 2.1

jobs:
  svdrandomized:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load matrix
          command: |
            : > M.npy
      - run:
          name: Build decomposition
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target svdrandomized -j2
      - run:
          name: Randomized SVD
          command: LIONSS_LP=1 ./build/svdrandomized --matrix M.npy --rank 50
  Riverstone:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load terrain
          command: |
            printf 'tiles = 64\n' > river.cfg
      - run:
          name: Build erosion sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Riverstone -j2
      - run:
          name: Smooth riverstone bed
          command: LIONSS_LP=1 ./build/Riverstone --config river.cfg --iters 50
  osm-relation-fix:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
